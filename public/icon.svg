<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Background Rounded Shield / Tile -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="#0b1329" />
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" opacity="0.18" />
  <rect x="24" y="24" width="464" height="464" rx="112" stroke="url(#bgGrad)" stroke-width="10" opacity="0.7" />

  <!-- Inner Soccer Ball / Badge -->
  <g filter="url(#shadow)">
    <!-- Outer Ball Circle -->
    <circle cx="256" cy="256" r="150" fill="#ffffff" stroke="#10b981" stroke-width="8" />
    
    <!-- Central Pentagon -->
    <polygon points="256,200 296,230 280,278 232,278 216,230" fill="#0b1329" />
    
    <!-- Lines from Center to Edges -->
    <line x1="256" y1="200" x2="256" y2="124" stroke="#0b1329" stroke-width="7" stroke-linecap="round" />
    <line x1="296" y1="230" x2="368" y2="206" stroke="#0b1329" stroke-width="7" stroke-linecap="round" />
    <line x1="280" y1="278" x2="324" y2="346" stroke="#0b1329" stroke-width="7" stroke-linecap="round" />
    <line x1="232" y1="278" x2="188" y2="346" stroke="#0b1329" stroke-width="7" stroke-linecap="round" />
    <line x1="216" y1="230" x2="144" y2="206" stroke="#0b1329" stroke-width="7" stroke-linecap="round" />

    <!-- Outer Pentagons/Patches -->
    <polygon points="256,124 224,112 288,112" fill="#0b1329" />
    <polygon points="368,206 390,242 376,172" fill="#0b1329" />
    <polygon points="324,346 360,338 296,384" fill="#0b1329" />
    <polygon points="188,346 216,384 152,338" fill="#0b1329" />
    <polygon points="144,206 136,172 122,242" fill="#0b1329" />
  </g>

  <!-- Live Pulse Dot -->
  <circle cx="396" cy="116" r="28" fill="#ef4444" stroke="#ffffff" stroke-width="6" />
</svg>
